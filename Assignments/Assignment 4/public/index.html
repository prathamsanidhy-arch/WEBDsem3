<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Help Desk</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Campus Help Desk</h1>
        
        <div id="message" class="message" style="display: none;"></div>

        <div class="form-container">
            <h2 id="form-title">Submit a Request</h2>
            <form id="requestForm">
                <input type="hidden" id="requestId">
                
                <div class="form-group">
                    <label for="studentName">Student Name:</label>
                    <input type="text" id="studentName" required>
                </div>
                
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" required>
                </div>
                
                <div class="form-group">
                    <label for="category">Category:</label>
                    <select id="category" required>
                        <option value="">Select Category</option>
                        <option value="Academics">Academics</option>
                        <option value="Hostel">Hostel</option>
                        <option value="Electricity">Electricity</option>
                        <option value="Internet">Internet</option>
                        <option value="Library">Library</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="description">Problem Description:</label>
                    <textarea id="description" rows="4" required></textarea>
                </div>
                
                <div class="form-group">
                    <label for="priority">Priority:</label>
                    <select id="priority" required>
                        <option value="Low">Low</option>
                        <option value="Medium" selected>Medium</option>
                        <option value="High">High</option>
                    </select>
                </div>
                
                <button type="submit" id="submitBtn">Submit Request</button>
                <button type="button" id="cancelBtn" style="display: none;">Cancel Edit</button>
            </form>
        </div>

        <div class="requests-container">
            <h2>Submitted Requests</h2>
            <table id="requestsTable">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Category</th>
                        <th>Priority</th>
                        <th>Description</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="requestsList"></tbody>
            </table>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
